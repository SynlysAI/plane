command = 'D:\plane-main\plane-dev\demos\sciencediscovery-plane-mcp\.venv\Scripts\python.exe'
args = ['D:\plane-main\plane-dev\demos\sciencediscovery-plane-mcp\agent_mcp.py', '--config', 'C:\Users\STUDENT\.config\plane-agent\config.local.json']
